[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "0.8.0"
description = "AES-128 encryption, authenticated encryption, hashing, HMAC and key derivation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome==3.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0"
]

[project.scripts]
cryptocore = "cryptocore.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]